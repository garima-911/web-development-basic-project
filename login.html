<!DOCTYPE html>
<head lang="eng">
    <title>my login page</title>
    <link rel="stylesheet" href="login.css">
   <script src="https://kit.fontawesome.com/b1987e1c00.js" crossorigin="anonymous"></script>
</head>
<body>
    
    <div class="main">
        <div class="logo">
<div class="logo-user">
<i class="fa-regular fa-user" style="color: rgb(116, 192, 252);"></i>
</div>
</div>
<div class="text">
    <h1>Welcome Back</h1>
    <p>Login to your account</p>
</div>

<div class="login-btn">
    <div class="btn">
        <i class="fa-regular fa-user" style="color: white;"></i>
        <input type="text" placeholder="Email or Username" >
        
    </div>
</div>

<div class="login-btn">
    <div class="btn">
       <i class="fa-solid fa-unlock" style="color: white"></i>
       <input type="password" name="lock" id="lock" placeholder="Password">
       
    </div>
</div>

<div class="letter">
    <span id="checkbox">
    <input type="checkbox" name="remember"id="remember" >
    
    <p>Remember me</p>
</span>
    <a href="">Forget me?</a>
</div>

<div class="login-box">
    <input type="button" value="Login">
</div>

<div class="login-box" id="box">
    <p>Don't have any account?</p>
    <a href="">Sign up</a>
</div>
    </div>
</body>
