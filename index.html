<!DOCTYPE html>
<head lang="eng">
    <title>login page</title>
    <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
<div class="main">
  <div class="header">
    
    <div class="logo">
      <i class="fa-solid fa-lock" style="color: rgb(177, 151, 252);"></i>
    </div>

      <div class="paragraph">
    <h1>Welcome Back</h1>
    <p>Login to your account</p>
    </div>

  </div>


    <div class="box">
        <p style="font-size: 20px;">Email:</p>

        <div class="input-logo">
        <span class="envolop">
        <i class="fa-regular fa-envelope" style="color: rgb(177, 151, 252);"></i>
        </span>
      <input type="email" name="enter " id="input" placeholder="Enter your email">
      </div>

       <p style="font-size: 20px; margin-top: 20px;">Password:</p>

      <div class="input-logo">
       
        <span class="envolop">
        <i class="fa-solid fa-unlock" style="color: rgb(177, 151, 252);"></i>
        </span>
         <input type="password" id="input" placeholder="Enter your password">
      </div>

      <div class="line">
        <input type="checkbox" name="check" id="check" >
        <label for="check">Remember me</label>

        <a href="###">Forget Password?</a>
      </div>

      <div class="login">
       
        <input type="button" value="Login">
       
      </div>
      <div class="or">
        <hr>
        
        <p>OR</p>
      
      </div>

      <div class="google">
        <span id="button">
          <i class="fa-brands fa-google" style="color: rgb(116, 192, 252);"></i>
          <input type="button" value="Login with Google">
        </span>

        <span id="button">
        <i class="fa-brands fa-facebook" style="color: rgb(116, 192, 252);"></i>
        <input type="button" value="Login with Facebook">
        </span>
        
      </div>

      <div class="box2">
        <p>Don't have an account?</p>
        <a href="">Sign up</a>
      </div>


    </div>
    
</div>

</body>

</html>
